yunyou-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true }
yunyou-tools = { workspace = true }
yunyou-system-prompt = { workspace = true }
yunyou-commands = { path = "../../shell/yunyou-commands" }

[lints]
workspace = true
