[package]
name = "yunyou-tools"
description = "ToolDefinition 契约 + 注册表 + 执行器（超时/取消/路径约束）+ 六个内置工具（方案 §2.5）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yunyou = { workspace = true }
yunyou-util = { workspace = true }
yunyou-llm = { workspace = true }
yunyou-commands = { path = "../../shell/yunyou-commands" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
schemars = "1"
# 沙箱实现面依赖（原 yunyou-sandbox 并档，2026-11-19）
libc = "0.2"
landlock = "0.4.4"
seccompiler = "0.5.0"
yunyou-system-prompt = { path = "../../shell/yunyou-system-prompt" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# K-14 第 1 步/观察期：继承 workspace lints（unwrap_used/expect_used=warn）
[lints]
workspace = true
