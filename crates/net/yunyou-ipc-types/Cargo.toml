[package]
name = "yunyou-ipc-types"
description = "网关↔大 agent IPC 消息类型单源（K-12 阶段 A，serde+schemars 唯一真源；帧常量与凭证路径约定）"
version = "0.1.0"
edition = "2021"
license = "MIT"


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
# 无

# K-14 第 1 步/观察期：继承 workspace lints（unwrap_used/expect_used=warn）
[lints]
workspace = true
