# hello-sdk 落盘 manifest（market v2 形态；L2 设计 §3.1 字段）
id = "hello-sdk"
version = "0.1.0"
format = 2
level = "market"
contracts = ["tools.v1"]
category = "tools"
auto_enable = true

[runtime]
type = "subprocess"
entry = ["hello-sdk"]            # 相对插件目录=cargo build 产物名
request_timeout_ms = 30000

[permissions]
writable = ["$SELF"]             # 缺省=仅插件目录可写
credentials = []                 # MVP 凭据面未开闸，恒空
network = false                  # MVP 网络面恒禁
