[package]
name = "web-search-sample"
description = "web_search 外部插件样板（分发链 release-bin；复用 crates/plugins/bundled/yunyou-web-search 同一检索实现——bundled 与外部不两套逻辑）"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
yunyou-plugin-sdk = { path = "../../yunyou-plugin-sdk" }
yunyou-web-search = { path = "../../../crates/plugins/bundled/yunyou-web-search" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bin]]
name = "web-search"
path = "src/main.rs"

[lints]
workspace = true
