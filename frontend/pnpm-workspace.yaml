# 云悠 web 前端 vendor 工作区（移植自 deepseek-harness@e8f7b93a344964de3dca1ace9e72b6e4d6de87cb）
# 裁剪说明：仅保留 shell+client 面构建所需子集（97 工作区包）；host 世界
# （native/system、benchmarks、website、python）不入树。上游 overrides 三条随源保留。
packages:
  - vendor/*
  - packages/*/*
  - apps/*
  # node-addon-system（webworker-runtime 依赖）上游居于 native/system/packages/
  - native/system/packages/*

overrides:
  '@earendil-works/pi-ai': '1.3.0'
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ 对带 install/build 脚本的依赖默认拒绝（strictDepBuilds）。
# 子集仅需 esbuild（vite 依赖，native 二进制）。以下四件为宿主世界传递依赖
# （llm-pi-ai/subprocess 链带入），浏览器构建不消费其原生产物——显式 deny。
allowBuilds:
  '@google/genai': false
  esbuild: true
  koffi: false
  node-pty: false
  protobufjs: false

# 上游 reviewed patch（llm-pi-ai 依赖）：provider 数据与 pi-ai 类型对齐
patchedDependencies:
  '@earendil-works/pi-ai@1.3.0': patches/@earendil-works__pi-ai@1.3.0.patch
